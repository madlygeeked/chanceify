<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#0a0914">
<meta property="og:type" content="website">
<meta property="og:site_name" content="chanceify™">
<meta property="og:title" content="chanceify™">
<meta property="og:description" content="music reimagined">
<meta property="og:url" content="https://madlygeeked.github.io/chanceify/">
<meta property="og:image" content="https://madlygeeked.github.io/chanceify/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="chanceify™">
<meta name="twitter:description" content="music reimagined">
<meta name="twitter:image" content="https://madlygeeked.github.io/chanceify/social-preview.png">
<link rel="icon" type="image/png" href="https://madlygeeked.github.io/assets/favicon.png">
<style>html{background:#2a1850}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap">
<link rel="stylesheet" href="https://madlygeeked.github.io/style.css?v=23">
<link rel="stylesheet" href="https://madlygeeked.github.io/docs.css?v=23">
</head>
<body class="hdr-right scenic-docs">
<canvas id="flow" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top bar">
    <a class="brand" data-brand-link href="https://madlygeeked.github.io/"><img data-brand-logo hidden alt=""><span class="brandname" data-brand-name>madgeeked</span></a>
  </div>
  <div class="spacer" style="height:clamp(12px,5vh,48px)"></div>
  <main class="doc">
    {% if page.hero %}
    <div class="hero">
      <img src="https://madlygeeked.github.io/assets/chanceify.png" alt="">
      <div>
        <h1>{{ site.title }}</h1>
        {% if page.tagline %}<p class="tag">{{ page.tagline }}</p>{% endif %}
        <div class="actions">
          <a class="btn primary big" href="https://github.com/madlygeeked/chanceify/releases">download</a>
          <a class="btn" href="https://github.com/madlygeeked/chanceify">source code</a>
        </div>
      </div>
    </div>
    {% endif %}
    {{ content }}
  </main>
  <p class="foot"><span style="display:inline-block;padding:7px 18px;border-radius:999px;background:rgba(10,9,20,.72);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)">built with love by <a href="https://github.com/madlygeeked" data-bear="chance">chance</a></span></p>
</div>
<script src="https://madlygeeked.github.io/chrome.js?v=23" data-site="https://madlygeeked.github.io/"></script>
<script src="https://madlygeeked.github.io/themes.js?v=23" data-site="https://madlygeeked.github.io/" data-theme="chanceify"></script>
</body>
</html>

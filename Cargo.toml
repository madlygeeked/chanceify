[package]
name = "chanceify"
default-run = "chanceify"
version = "0.91.12"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
description = "music reimagined ."
repository = "https://github.com/madlygeeked/chanceify"
keywords = ["spotify", "music", "egui", "librespot", "player"]
categories = ["multimedia::audio"]

[lib]
name = "chanceify"
path = "src/lib.rs"

[[bin]]
name = "chanceify"
path = "src/chanceify.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
# One protected-store API, with only each target's native provider below.
# Durable Spotify grants must not be copied into ordinary state JSON.
keyring-core = "1"
# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D music client.
# AccessKit connects egui's control names, states, and actions to native screen readers.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg"] }
# The shared foundation of Chanceify, ZapFast, RekordFlash and TonePush
# (crmne/fastframe). Every crate comes from the same revision; move them
# together.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
# Colour emoji in the platform's own style (Apple Color Emoji, Segoe UI
# Emoji, the desktop's colour emoji font), in every text through its egui
# plugin.
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
# Catalogs compiled from PO files at build time (see build.rs) and the
# system's preferred languages. No libintl or runtime catalog parsing.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
# The log file for bug reports and the panic log (env_logger underneath).
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
# The tray item, so closing the window can keep the music playing:
# StatusNotifier on Linux, the notification area on Windows, the menu bar
# on macOS.
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
# Keeps the app running without a window around eframe::run_native.
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
# The macOS title-bar double-click setting (does nothing elsewhere).
fastframe-macos = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1" }
# Self-update from GitHub releases, on the reqwest client below.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1", features = ["reqwest"] }
# Decoding cover art: JPEG and PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Filling glyph outlines for the Windows taskbar thumbnail buttons
# (src/thumbbar.rs). Already compiled for the SVG icons through egui_extras
# and resvg, so this adds no code to the build.
tiny-skia = "0.11"
# Detect the live window backend. eframe already compiles this crate.
raw-window-handle = "0.6"
# Spotify playback and Connect. rustls everywhere so the client links one TLS
# stack and builds without OpenSSL on every platform.
#
# librespot-core depends on hyper-proxy2 for HTTP proxy support. The
# published 0.1.0 release pins rustls 0.22 / rustls-webpki 0.102; we patch
# it (see [patch.crates-io]) onto rustls 0.23 so CONNECT-then-TLS uses the
# same stack as the rest of the client. SOCKS5 still covers the Web API but
# not the engine: librespot only speaks HTTP CONNECT.
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
librespot-connect = { version = "0.8", default-features = false }
librespot-metadata = { version = "0.8", default-features = false }
librespot-protocol = { version = "0.8", default-features = false }
# Parses the rootlist's playlist4 protobuf, the same crate librespot generates with.
protobuf = "3"
# Local playback's audio sink is this crate's own (src/sink.rs): librespot's
# rodio backend unwraps the device open on the player thread, and a release
# build aborts on panic. Same rodio and cpal versions librespot-playback uses,
# so nothing new is compiled.
rodio = { version = "0.21", default-features = false, features = ["playback"] }
cpal = "0.16"
# `socks` is SOCKS5 proxy support for the Web API, artwork, lyrics, and
# update checks. HTTP proxies work without it. `system-proxy` reads the OS
# proxy on macOS and Windows when the mode is System; Linux uses environment
# variables either way.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "blocking", "socks", "system-proxy"] }
# Same System-proxy matcher reqwest uses, so local playback follows the same
# HTTP proxy (environment, and the OS proxy on macOS and Windows).
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http = "1"
# `fs` is used by the playlist cache in `backend.rs`. On Linux the
# mpris-server dependency happens to turn it on, which is why leaving it out
# built there and nowhere else. `net` is the local HTTP-proxy tests.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
# Reading and measuring audio files in the local songs folder. librespot
# already compiles symphonia's mp3, flac, ogg and vorbis; this adds wav,
# aac and m4a.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4", "alac"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
# Native asynchronous file selection on macOS, Windows and Linux desktop portals.
rfd = "0.17.2"
rand = "0.9"
open = "5"
percent-encoding = "2"
urlencoding = "2"
jiff = "0.2"
mdns-sd = "0.21"
unicode-bidi = "0.3"
hmac = "0.12"
pbkdf2 = "0.12"
aes = "0.8"
ctr = "0.9"

[target.'cfg(not(target_os = "linux"))'.dependencies]
# The desktop's media controls on Windows and macOS, so closing the window
# keeps the music playing there too. Linux has mpris-server below.
souvlaki = { version = "0.8", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# The application menus and Dock menu (src/mac_menu.rs). "exception" lets
# src/mac_touchbar_crash_guard.rs catch a specific AppKit Objective-C
# exception instead of letting it abort the process.
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSWindow"] }
# NSAppleEventManager and NSAppleEventDescriptor carry the Spotify links
# macOS hands an app registered for the scheme (src/mac_links.rs), and
# NSRunLoop has the delayed perform the title bar uses (src/window.rs).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSObjCRuntime", "NSRunLoop", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
# A hidden window for the media controls to belong to, and message loops.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reuses the zbus/Tokio stack already used for desktop integration.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rodio-backend", "pulseaudio-backend", "rustls-tls-native-roots"] }
mpris-server = { version = "0.10", features = ["tokio"] }
# The bus mpris-server already speaks, named directly so its interface macro
# resolves: the running instance answers `Open` on its own name for the
# launch a Spotify link makes (src/single_instance.rs). Same version, so
# nothing new is compiled.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Keeps the X11 mini player out of the taskbar with _NET_WM_STATE_SKIP_TASKBAR
# (src/window.rs), which winit only offers on Windows. winit already
# compiles this version.
x11rb = { version = "0.13", default-features = false }

[build-dependencies]
# Drops unfinished PO entries and compiles catalog text and gettext plural
# expressions to Rust. Ordinary builds do not need gettext tools.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.2.1", features = ["build"] }

[dev-dependencies]
# Checks that every catalog covers the template and keeps its placeholders.
polib = "0.3"
# Run connection-deadline regressions with a virtual clock.
tokio = { version = "1", features = ["test-util"] }

# The icon and version information Windows shows for the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
# Sample data and screenshot flags; never part of a release build.
demo = []
# Keeps the console window on Windows, for `println!` and `dbg!` while
# working on it. Off by default, and off in every release: a reader who
# starts the app should get one window, not a window and a terminal.
console = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Unwind, not abort: a mistake while drawing is caught and skipped (see
# entrypoint.rs and ui/player_bar.rs `guarded`) instead of closing the program.
panic = "unwind"

# For everyday builds on Chance's PC (build.bat): same optimised dependencies,
# but no link-time pass over the whole program and the program's own code split
# into parallel pieces that are rebuilt incrementally. Much quicker to build,
# a little slower to run. build-final.bat uses the full release profile.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Audio decoding and immediate-mode layout are too slow at opt-level 0 to
# audition the app in development. Keep every dependency optimized while the
# application crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# crmne/egui apps-0.36, shared with ZapFast, RekordFlash and TonePush: egui
# 0.36.1 with right-to-left runs shaped in their bidi direction and digits
# shaped left to right in text without right-to-left letters
# (emilk/egui#8577), egui's busy-loop fix (emilk/egui#8398), and eframe pacing
# Wayland frames by the compositor's frame callbacks so a window the
# compositor stops showing never blocks in a vsync swap (emilk/egui#8631,
# #266). Every egui crate comes from the same revision so they share one emath
# and epaint. Drop this once egui releases all three.
ecolor = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
eframe = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
emath = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
# crmne/winit apps-0.30, shared with the same apps: winit 0.30.13 plus Wayland
# `Occluded` for the xdg-shell suspended state with commits on the app's behalf
# while it isn't presenting (rust-windowing/winit#4709, #4710), macOS Quit
# through close requests behind a feature Chanceify leaves off (winit#4692).
# Its Wayland file drops are reverted for now: Hyprland gives the clipboard
# and drags only to an app's first data device, so winit's own device took
# the clipboard from egui's (#614). eframe from the fork above calls the
# Occluded API. Move both forks together with the other apps.
winit = { git = "https://github.com/crmne/winit", rev = "544a73716c7a54c916d97d6c86c0b1bdaa81234e" }
# hyper-proxy2's unreleased rustls 0.23 update plus our upstream provider
# compatibility fix. Drop this fork when a release includes both changes.
hyper-proxy2 = { git = "https://github.com/crmne/hyper-proxy2", rev = "efca4811371ddae81c06be168de54194938d70b1" }
# librespot 0.8.0 plus the small patches Chanceify needs: queue controls,
# normalisation-factor reporting for the visualisers, and a distinct event
# when Spotify refuses an audio key, bounded socket setup with DNS address
# fallback, an in-memory credential cache for platform storage, full
# playback-state recovery after a session disconnect, the desktop platform
# signature for Windows on ARM, and a volume set while the device is inactive.
# Recovery is proposed upstream in librespot-org/librespot#1765 and the
# volume in librespot-org/librespot#1770; the ARM signature answers
# librespot-org/librespot#1737.
# Every librespot crate comes from the
# fork so one copy exists. Drop patches as upstream takes them.
librespot-audio = { git = "https://github.com/crmne/librespot", rev = "23fc42cff37848e51f0d8eaefad1a93941b71e59" }
librespot-connect = { git = "https://github.com/crmne/librespot", rev = "23fc42cff37848e51f0d8eaefad1a93941b71e59" }
librespot-core = { git = "https://github.com/crmne/librespot", rev = "23fc42cff37848e51f0d8eaefad1a93941b71e59" }
librespot-metadata = { git = "https://github.com/crmne/librespot", rev = "23fc42cff37848e51f0d8eaefad1a93941b71e59" }
librespot-oauth = { git = "https://github.com/crmne/librespot", rev = "23fc42cff37848e51f0d8eaefad1a93941b71e59" }
librespot-playback = { git = "https://github.com/crmne/librespot", rev = "23fc42cff37848e51f0d8eaefad1a93941b71e59" }
librespot-protocol = { git = "https://github.com/crmne/librespot", rev = "23fc42cff37848e51f0d8eaefad1a93941b71e59" }
